<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-Row - Sistem Peminjaman Barang</title>
    <link rel="stylesheet" href="user-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-boxes"></i> P-Row</h2>
                <p>Sistem Peminjaman Barang</p>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-section="pengajuan">
                        <i class="fas fa-file-alt"></i>
                        <span>Pengajuan Peminjaman</span>
                    </li>
                    <li class="nav-item" data-section="status">
                        <i class="fas fa-list-check"></i>
                        <span>Daftar Status Peminjaman</span>
                    </li>
                    <li class="nav-item" data-section="admin-list">
                        <i class="fas fa-users"></i>
                        <span>Daftar Admin</span>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1 id="page-title">Pengajuan Peminjaman</h1>
                </div>
                <div class="header-right">
                    <div class="user-info" onclick="toggleUserMenu()">
                        <i class="fas fa-user-circle"></i>
                        <span>User</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <!-- User Menu Dropdown -->
                    <div class="user-menu" id="user-menu">
                        <div class="user-menu-item">
                            <i class="fas fa-user"></i>
                            <span>User Profile</span>
                        </div>
                        <div class="user-menu-item">
                            <i class="fas fa-cog"></i>
                            <span>Settings</span>
                        </div>
                        <div class="user-menu-item">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Sections -->
            <div class="content">
                <!-- Pengajuan Peminjaman Section -->
                <div id="pengajuan" class="section active">
                    <div class="form-container">
                        <h3>Form Pengajuan Peminjaman</h3>
                        <form id="peminjaman-form">
                            <div class="form-group">
                                <label for="admin-tujuan">Admin yang Dituju (Pemilik Barang) *</label>
                                <select id="admin-tujuan" name="admin-tujuan" required>
                                    <option value="">Pilih Admin</option>
                                    <option value="admin1">Admin Utama</option>
                                    <option value="admin2">Siti Nurhaliza</option>
                                    <option value="admin3">Rizki Pratama</option>
                                    <option value="admin4">Maya Indah</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="barang">Barang yang Ingin Dipinjam *</label>
                                <input type="text" id="barang" name="barang" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="jadwal-pengembalian">Request Jadwal Pengembalian *</label>
                                <input type="datetime-local" id="jadwal-pengembalian" name="jadwal-pengembalian" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="sosmed">Akun Media Sosial (Opsional)</label>
                                <input type="text" id="sosmed" name="sosmed" placeholder="Instagram: @username atau Facebook: nama">
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-paper-plane"></i> Kirim Pengajuan
                                </button>
                                <button type="reset" class="btn btn-secondary">
                                    <i class="fas fa-undo"></i> Reset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Status Peminjaman Section -->
                <div id="status" class="section">
                    <div class="status-container">
                        <div class="status-header">
                            <h3>Daftar Status Peminjaman</h3>
                            <div class="filter-controls">
                                <select id="status-filter" class="filter-select">
                                    <option value="all">Semua Status</option>
                                    <option value="menunggu">Menunggu ACC</option>
                                    <option value="dipinjam">Sedang Dipinjam</option>
                                    <option value="dikembalikan">Telah Dikembalikan</option>
                                    <option value="telat">Telat Pengembalian</option>
                                </select>
                                <button class="btn btn-primary" onclick="refreshData()">
                                    <i class="fas fa-refresh"></i> Refresh
                                </button>
                            </div>
                        </div>
                        
                        <div class="status-list" id="status-list">
                            <!-- Status items will be populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Daftar Admin Section -->
                <div id="admin-list" class="section">
                    <div class="admin-container">
                        <div class="admin-header">
                            <h3>Daftar Admin</h3>
                            <p>Admin yang pernah dihubungi/dipinjam barangnya</p>
                        </div>
                        
                        <div class="admin-list" id="admin-list-container">
                            <!-- Admin items will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="user-script.js"></script>
</body>
</html>
